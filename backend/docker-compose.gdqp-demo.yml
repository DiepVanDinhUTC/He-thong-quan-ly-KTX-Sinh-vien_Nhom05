services:
  postgres-gdqp-demo:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ktx_gdqp_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ktx-demo-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ktx_gdqp_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ktx_gdqp_demo"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  ktx_gdqp_demo_data:
